[package]
name = "phramer"
version.workspace = true
description = "Phramer screenshot tool"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "phramer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Microsoft Store build: launch at sign-in comes from the package manifest's
# startup task, so the HKCU Run value is never written.
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the daemon's notification-area icon and menu.
tauri = { version = "2", features = ["tray-icon"] }
# One daemon per user; later invocations hand their arguments to it.
tauri-plugin-single-instance = "2"
# Global hotkeys (RegisterHotKey underneath; covers Print Screen and Win combos).
tauri-plugin-global-shortcut = "2"
thiserror = "2"
log = "0.4"
# The C++ region syntax is a PCRE search; same leftmost-first captures.
regex = "1"

phramer-core = { path = "../../crates/phramer-core" }
phramer-capture = { path = "../../crates/phramer-capture" }
# The capture overlay and the export.
phramer-overlay = { path = "../../crates/phramer-overlay" }

# Run value, single-instance lock check, tray balloons.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# tests/smoke.rs lists processes by image path, finds the overlay's monitor
# in physical pixels and sends the overlay keys.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
