name: Release(Windows MSI)

# Builds the Windows installer and publishes it as a GitHub Release asset,
# which - unlike a workflow artifact - never expires and is downloadable
# with a direct link.
#
# Usage: bump FLAMESHOT_VERSION in CMakeLists.txt, commit, then
#   git tag v14.1.0 && git push origin v14.1.0
# Or run this workflow manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release under (e.g. v14.1.0)'
        required: true

permissions:
  contents: write

env:
  QT_VERSION: 6.9.3

jobs:
  windows-msi:
    name: Build and publish MSI
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtimageformats'
          cache: true
          cache-key-prefix: install-qt-action-${{ env.QT_VERSION }}
          dir: ${{ github.workspace }}/qt

      - name: Locate Visual Studio
        shell: pwsh
        # The build runs windeployqt --compiler-runtime as a POST_BUILD step,
        # which needs VCINSTALLDIR to find the MSVC redistributables. Without
        # it that command fails and takes the whole build down with it.
        # Resolved with vswhere rather than hardcoded, so this survives a
        # change of runner image or VS edition.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          if (-not $vsPath) { throw "Could not locate a Visual Studio installation" }
          "VCINSTALLDIR=$vsPath\VC" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "VCINSTALLDIR=$vsPath\VC"

      - name: Configure
        shell: pwsh
        # The version is derived from the tag right here rather than handed
        # over from another step: an empty step output silently produced
        # -DRELEASE_VERSION= and only surfaced minutes later as an obscure
        # resource-compiler error. No backtick line continuations either,
        # since those break if the runner writes the script with CRLF.
        # USE_PORTABLE_CONFIG must be OFF for an installed build: the
        # portable default writes flameshot.ini next to the executable,
        # which is not writable under Program Files. OFF puts the config
        # in the user's AppData instead.
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$tag' must be a numeric version like v14.1.0" }
          Write-Host "Building version $version from tag $tag"
          # The -D argument must be quoted: PowerShell does not expand a
          # variable inside a bare token that starts with a dash, so an
          # unquoted -DRELEASE_VERSION=$version reaches CMake literally.
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DUSE_PORTABLE_CONFIG=OFF "-DRELEASE_VERSION=$version"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package MSI
        shell: pwsh
        working-directory: build
        run: cpack -G WIX -C Release -B "${{ github.workspace }}/build/Package"

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $msi = Get-ChildItem "${{ github.workspace }}/build/Package/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi produced by cpack" }
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/dist" | Out-Null
          Copy-Item $msi.FullName "${{ github.workspace }}/dist/"
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          $sumPath = "${{ github.workspace }}/dist/$($msi.Name).sha256sum"
          "$hash  $($msi.Name)" | Out-File -Encoding utf8 $sumPath
          Write-Host "Packaged $($msi.Name) ($hash)"

      # Kept so the build is still retrievable if publishing the release
      # fails (for example when the tag already exists)
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phramer-windows-msi
          path: ${{ github.workspace }}/dist/*
          overwrite: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: ${{ github.workspace }}/dist/*
