[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "16.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MichaelNguyen5653/Phramer"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
